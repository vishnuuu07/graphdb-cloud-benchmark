[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "graphbench"
version = "0.1.0"
description = "Reproducible graph database benchmark harness"
requires-python = ">=3.11"
dependencies = [
    "certifi==2026.1.4",
    "falkordb==1.7.1",
    "neo4j==5.28.1",
    "python-arango==8.3.3",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["matplotlib==3.10.6", "pytest==8.3.5", "ruff==0.9.10"]

[project.scripts]
graphbench = "graphbench.cli:main"

[tool.setuptools.packages.find]
include = ["graphbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
