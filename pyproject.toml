[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "graphbench"
version = "0.1.0"
description = "Reproducible graph database benchmark harness"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.9.10"]

[project.scripts]
graphbench = "graphbench.cli:main"

[tool.setuptools.packages.find]
include = ["graphbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
